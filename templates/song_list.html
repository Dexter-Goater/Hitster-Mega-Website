{%extends "layout.html" %}
{%block content%}
<link rel="stylesheet" href="/static/css/style.css">

<style>
  .container {  
    display: grid;
    grid-template-columns: 0.3fr 2fr;
    grid-template-rows: 1fr;
    gap: 0px 20px;
    grid-auto-flow: row;
    grid-template-areas:
      "Filters Songs";
  }

  .Filters { grid-area: Filters; }
  .Songs { grid-area: Songs; }

  .genre-filters {
    color: #fefdfd; 
    font-family: Montserrat, sans-serif; 
    font-weight: 500;
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 8px 12px;
    align-items: center;
    max-width: 200px;
  }

  .genre-filters label {
    display: contents;
    cursor: pointer;
  }
</style>

<div class="container">
  <div class="Filters">
    <p>
      <input 
        type="text" 
        id="songSearch" 
        placeholder="Search by title or artist..." 
        onkeyup="applyFilters()"
      >
      <br>Sort:
      <select onchange="filterSongs(this.value)">
        <option value="default">Default</option>
        <option value="alpha">Alphabetically</option>
        <option value="date">By Release Date</option>
        <option value="artist">By Artist</option>
      </select>
    </p>

    <h2>Filter Genre</h2>
    <div class="genre-filters">
      <label><span>Rock:</span> <input type="checkbox" class="genreCheck" data-genre-id="0" onclick="applyFilters()"></label>
      <label><span>Pop:</span> <input type="checkbox" class="genreCheck" data-genre-id="1" onclick="applyFilters()"></label>
      <label><span>Soul:</span> <input type="checkbox" class="genreCheck" data-genre-id="2" onclick="applyFilters()"></label>
      <label><span>Hip-Hop:</span> <input type="checkbox" class="genreCheck" data-genre-id="3" onclick="applyFilters()"></label>
      <label><span>Country:</span> <input type="checkbox" class="genreCheck" data-genre-id="4" onclick="applyFilters()"></label>
      <label><span>Jazz:</span> <input type="checkbox" class="genreCheck" data-genre-id="5" onclick="applyFilters()"></label>
      <label><span>Blues:</span> <input type="checkbox" class="genreCheck" data-genre-id="6" onclick="applyFilters()"></label>
      <label><span>Electronic:</span> <input type="checkbox" class="genreCheck" data-genre-id="7" onclick="applyFilters()"></label>
      <label><span>Folk:</span> <input type="checkbox" class="genreCheck" data-genre-id="8" onclick="applyFilters()"></label>
      <label><span>Metal:</span> <input type="checkbox" class="genreCheck" data-genre-id="9" onclick="applyFilters()"></label>
      <label><span>Reggae:</span> <input type="checkbox" class="genreCheck" data-genre-id="10" onclick="applyFilters()"></label>
      <label><span>Funk:</span> <input type="checkbox" class="genreCheck" data-genre-id="11" onclick="applyFilters()"></label>
      <label><span>Disco:</span> <input type="checkbox" class="genreCheck" data-genre-id="12" onclick="applyFilters()"></label>
      <label><span>Punk:</span> <input type="checkbox" class="genreCheck" data-genre-id="13" onclick="applyFilters()"></label>
      <label><span>Latin:</span> <input type="checkbox" class="genreCheck" data-genre-id="14" onclick="applyFilters()"></label>
    </div>
  </div>
  <div class="Songs">
    <div id="songList">
      {% for song in songs %}
        <p class="song-item"
           data-id="{{song[0]}}"
           data-title="{{song[1]}}" 
           data-artist="{{song[2]}}" 
           data-date="{{song[3]}}"
           data-genres="{{ song_genres.get(song[0], [])|map('string')|join(',') }}">
            <img src="/static/cover_art/{{song[0]}}.jpg" style="width: 5%; height: 5%; vertical-align: middle;">
            <span>{{song[1]}} by {{song[2]}}</span>
        </p>
      {% endfor %}
    </div>
  </div>
</div>

<script>
    function getCheckedGenres() {
        return [...document.querySelectorAll(".genreCheck:checked")]
            .map(cb => cb.dataset.genreId);
    }
    function applyFilters() {
        const query = document.getElementById("songSearch").value.toLowerCase();
        const checkedGenres = getCheckedGenres();
        const songs = document.querySelectorAll(".song-item");

        songs.forEach(song => {
            const text = song.textContent.toLowerCase();
            const matchesSearch = text.includes(query);

            const songGenres = song.dataset.genres ? song.dataset.genres.split(",") : [];
            // Song must contain every checked genre, not just one
            const matchesGenre = checkedGenres.length === 0 || 
                checkedGenres.every(g => songGenres.includes(g));

            song.style.display = (matchesSearch && matchesGenre) ? "" : "none";
        });
    }

    function filterSongs(mode) {
        const list = document.getElementById("songList");
        const songs = [...list.querySelectorAll(".song-item")];
        songs.sort((a, b) => {
            if (mode === "default") return a.dataset.id.localeCompare(b.dataset.id)
            if (mode === "alpha") return a.dataset.title.localeCompare(b.dataset.title);
            if (mode === "artist") return a.dataset.artist.localeCompare(b.dataset.artist);
            if (mode === "date") return a.dataset.date - b.dataset.date;
            return 0; 
        });
        songs.forEach(song => list.appendChild(song));
    }
</script>
{%endblock%}
