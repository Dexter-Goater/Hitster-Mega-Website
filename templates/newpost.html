{%extends "layout.html" %}
{%block content%}
<body>
    <h2>Enter Post Information</h2>
    <form action="/submit" method="POST">

        <input type="text" id="title" name="title" required placeholder="Title" size="50" maxlength="50"><br><br>
        <textarea type="content" id="content" name="content" required placeholder="Text" cols="50" rows="5" style="resize: none;"></textarea><br><br>
        
        <button type="submit">Submit</button>
    </form>
</body>
{%endblock%}
