{%extends "layout.html" %}
{%block content%}
<link rel="stylesheet" href="/static/css/style.css">
<p>
<button style="margin-left: 2%; margin-bottom: 1%;margin-top: 0.5%;" onclick="location.href='http://127.0.0.1:5000/help/newpost';">Create new post</button>
<input 
    type="text" 
    id="postSearch" 
    placeholder="Search for a post" 
    onkeyup="filterSearchPosts()"
>
    Filter:
    <select onchange="filterposts(this.value)">
        <option value="default">Default</option>
        <option value="alpha">Alphabetically</option>
        <option value="date">By Post Date</option>
        <option value="resolved">Resolved</option>
    </select>
</p>
<div id="postList">
{%for post in posts%}
    <div class="postItem"
        data-id="{{post[0]}}"
        data-title="{{post[2]}}"
        data-resolved="{{post[3]}}"
        data-date="{{post[4]}}"
        style="margin-bottom: 1%;">
        <a class="post-item"
        href="/help/{{post[0]}}"
        style="justify-content: left; align-items: center; margin-left: 1%; margin-top: 2%; display: inline;">{{post[2]}} </a>
        <span style="display: inline-flex; float: right;margin-right: 0.5%; color:#fefdfd;font-family: Montserrat,sans-serif; font-weight: 500;">
        {% if post[3] == 1 %}
        ✅ Resolved : 
        {% endif %}
        Post by {{post[5]}} <img src="{{post[6]}}" style="height: 1.2vw; width: 1.2vw; margin-left: 0.5vw; ">
        <div style="margin-left: 10px; display: flex; gap: 8px;">
            {%if isadmin%}
                <form action="/deletepost" method="POST">
                    <input type="hidden" name="post_id" value="{{post[0]}}">
                    <button type="submit" style="background-color:red;">Delete Post</button>
                </form>
            {%endif%}
        </div>
        </span>

    </div>
{%endfor%}
</div>
<br>

<script>
    function filterSearchPosts() {
        const query = document.getElementById("postSearch").value.toLowerCase();
        const posts = document.querySelectorAll(".postItem");
        posts.forEach(post => {
            const text = post.textContent.toLowerCase();
            post.style.display = text.includes(query) ? "" : "none";
        });
    }
    function filterposts(mode) {
        const list = document.getElementById("postList");
        const posts = [...list.querySelectorAll(".postItem")];
        posts.sort((a, b) => {
            if (mode === "default") return a.dataset.id.localeCompare(b.dataset.id);
            if (mode === "alpha") return a.dataset.title.localeCompare(b.dataset.title);
            if (mode === "resolved") return a.dataset.resolved.localeCompare(b.dataset.resolved);
            if (mode === "date") return a.dataset.date.localeCompare(b.dataset.date);
            return 0; 
        });
        posts.forEach(post => list.appendChild(post));
    }
</script>
{%endblock%}
