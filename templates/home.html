<div class="button-container"> <button class="choice-btn" id="before">Before</button>

    <button class="choice-btn" id="after">After</button>
</div>
<p class="song_info">{{search_song}} by {{artist}}</p>
<h1 class="song_info">{{year}}</h1>
<script>
  const correctId = "{{ correct_button }}".trim();


  const buttons = document.querySelectorAll('.choice-btn');


  buttons.forEach(button => {
    button.addEventListener('click', () => {
      console.log("You clicked:", button.id);
      console.log("The correct answer is:", correctId);


      if (button.id === correctId) {
        document.body.classList.add('correct-flash');
        setTimeout(() => {
          document.body.classList.remove('correct-flash');
        }, 1000);
        document.location.reload()
      } else {
        document.body.classList.add('error-flash');
        setTimeout(() => {
          document.body.classList.remove('error-flash');
        }, 1000);
        document.location.reload()
      }
    });
  });
window.onload = toggleElement()
function toggleElement(){
    const elements = document.querySelectorAll(".song_info");
    elements.forEach(element=>{
    element.hidden = !element.hidden;
    });
}  
</script>
