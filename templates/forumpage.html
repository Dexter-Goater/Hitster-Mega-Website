{%extends "layout.html" %}
{%block content%}
<link rel="stylesheet" href="/static/css/style.css">
<div style="background-color: #2c2c2c; display: inline-block; padding: 1vw; border-radius: 5px;">
    <h1 style="white-space: nowrap;">{{postinfo[2]}}</h1>
    <span style="display: inline-flex; margin-right: 5%; color:#fefdfd;font-family: Montserrat,sans-serif; font-weight: 500;">
        {% if postinfo[3] == 1 %}
        ✅ Resolved : 
        {% endif %}
        Post by {{postinfo[5]}} <img src="{{postinfo[6]}}" style="height: 1.2vw; width: 1.2vw; margin-left: 0.5vw; ">
    </span>
</div>
<br>
<br>
<div style="background-color: #2c2c2c; display: inline-block; padding: 0.2vw; border-radius: 5px;">
    <p>{{postinfo[3]}}</p>
</div>
<br>
<br>
<h1>Comments</h1>
<br>
{%for comment in comments%}
    <div style="background-color: #2c2c2c; display: inline-block;padding: 0.3vw; border-radius: 5px;">
        <p>{{comment[2]}}</p>
        <span style="display: inline-flex; color:#fefdfd;font-family: Montserrat,sans-serif; font-weight: 500;">
            {{comment[4]}} <img src="{{comment[5]}}" style="height: 1.2vw; width: 1.2vw; margin-left: 0.5vw; ">
        </span>
    </div>
    <br>
    <br>
{%endfor%}
<form action="/reply" method="POST">
    <input type="reply" id="reply" name="reply" required placeholder="Reply" size="50" maxlength="50"></input><br><br>
    <input type="hidden" name="page_ID" value="{{ page_ID }}">   
    <button type="submit">Submit</button>
</form>
{%endblock%}
